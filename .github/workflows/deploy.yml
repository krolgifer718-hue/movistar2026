# Deploy automático al servidor (Vultr) — ver DEPLOY.md
# Se ejecuta en cada push a main y manualmente (Actions → Deploy to Vultr → Run workflow).
# SSH al servidor → git fetch + reset --hard origin/main → npm install → next build
# → pm2 restart web → health check con reintentos.
#
# Secretos requeridos (GitHub → Settings → Secrets and variables → Actions):
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, DEPLOY_PATH, PM2_NAME

name: Deploy to Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git reset --hard origin/main
            npm install --no-audit --no-fund
            npm run build
            pm2 restart ${{ secrets.PM2_NAME }}
            sleep 3
            curl -sf --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null http://127.0.0.1:3000 && echo "LOCAL OK"

      - name: Health check HTTPS
        run: |
          curl -sf --retry 15 --retry-delay 5 --retry-all-errors -o /dev/null https://movistar-app-actualizate.online && echo "SITE OK"
